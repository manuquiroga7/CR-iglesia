<section id="horarios" class="bg-[var(--color-neutral)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div class="grid gap-10 rounded-md bg-[var(--color-green-deep)] p-8 text-[var(--color-cream)] shadow-[0_30px_60px_-24px_rgba(44,40,31,.14)] sm:p-12">
      <div class="grid gap-10 lg:grid-cols-[1.1fr_1.4fr]">
        <div>
          <span class="block text-xs font-bold uppercase tracking-[0.16em] text-[#9fb08f]">Nuestros encuentros</span>
          <span class="mb-1 block font-[var(--font-accent)] text-3xl text-[#e7c9a9]">Horarios de reuniones</span>
          <h2 class="font-[var(--font-heading)] text-3xl italic text-[var(--color-cream)] sm:text-4xl">Te esperamos</h2>
          <p class="mt-3 text-[#cfd9c2]">Todos son bienvenidos, sin excepción. Estas son nuestras reuniones semanales:</p>
          <address class="mt-6 text-sm not-italic leading-7 text-[#cfd9c2]">
            {{ content.address }}<br />
            <a [href]="content.instagramUrl" target="_blank" rel="noopener" class="text-[var(--color-cream)] underline underline-offset-2">
              {{ content.instagramHandle }}
            </a>
          </address>
        </div>

        <div class="grid gap-3">
          @for (item of content.schedule; track item.day) {
            <div class="flex items-baseline justify-between rounded border border-[var(--color-cream)]/14 bg-[var(--color-cream)]/6 px-5 py-4">
              <div>
                <span class="font-[var(--font-heading)] text-lg font-medium">{{ item.day }}</span>
                <span class="mt-1 block text-xs tracking-[0.02em] text-[#b9c4a8]">{{ item.kind }}</span>
              </div>
              <div class="font-[var(--font-heading)] text-2xl italic text-[#e7c9a9]">{{ item.time }}</div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
