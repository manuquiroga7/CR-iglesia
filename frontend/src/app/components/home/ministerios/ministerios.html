<section id="ministerios" class="border-t border-[var(--color-cream-line)] bg-[var(--color-cream-deep)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div class="mb-10 max-w-[640px]">
      <span class="mb-1 block font-[family-name:var(--font-accent)] text-4xl text-[var(--color-verde-deep)]">Cómo servimos</span>
      <h2 class="font-[family-name:var(--font-heading)] text-3xl text-[var(--color-green-deep)] sm:text-4xl">Nuestros ministerios</h2>
      <p class="mt-3 max-w-[52ch] text-[var(--color-ink-soft)]">Lugares donde servir al Señor en su iglesia.</p>
    </div>

    <div class="relative px-11 sm:px-24">
      <div
        class="overflow-hidden [touch-action:pan-y]"
        (pointerdown)="onPointerDown($event)"
        (pointerup)="onPointerUp($event)"
      >
        <div
          class="flex gap-6 transition-transform duration-700 ease-in-out"
          [style.transform]="'translateX(calc(-' + currentPage() + ' * (100% + 1.5rem)))'"
        >
          @for (page of pages(); track $index) {
            <div class="grid w-full shrink-0 grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
              @for (item of page; track item.name) {
                <div class="flex flex-col gap-3 rounded border border-[var(--color-cream-line)] bg-[var(--color-cream)] p-6">
                  <div class="flex h-11 w-11 items-center justify-center rounded-full bg-[var(--color-green)] text-[var(--color-cream)]">
                    <app-ministry-icon [name]="item.icon" />
                  </div>
                  <h3 class="font-[family-name:var(--font-heading)] text-lg text-[var(--color-green-deep)]">{{ item.name }}</h3>
                  <p class="text-sm text-[var(--color-ink-soft)]">{{ item.description }}</p>
                </div>
              }
            </div>
          }
        </div>
      </div>

      <button
        type="button"
        (click)="prev()"
        aria-label="Ministerios anteriores"
        class="absolute left-0 top-1/2 z-10 flex h-9 w-9 cursor-pointer items-center justify-center text-[var(--color-green-deep)]/60 transition [transform:translateY(-50%)] hover:[transform:translateY(-50%)_scale(1.15)] hover:text-[var(--color-green-deep)]"
      >
        <svg viewBox="0 0 24 24" class="h-6 w-6 fill-none stroke-current stroke-[1.5]"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button
        type="button"
        (click)="next()"
        aria-label="Siguientes ministerios"
        class="absolute right-0 top-1/2 z-10 flex h-9 w-9 cursor-pointer items-center justify-center text-[var(--color-green-deep)]/60 transition [transform:translateY(-50%)] hover:[transform:translateY(-50%)_scale(1.15)] hover:text-[var(--color-green-deep)]"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="mt-8 flex justify-center gap-2">
      @for (page of pages(); track $index) {
        <button
          type="button"
          (click)="goTo($index)"
          [attr.aria-label]="'Ir a la página ' + ($index + 1)"
          [class]="currentPage() === $index
            ? 'relative h-2 w-6 rounded-full bg-[var(--color-green-deep)] transition-all before:absolute before:-inset-3'
            : 'relative h-2 w-2 rounded-full bg-[var(--color-cream-line)] transition-all before:absolute before:-inset-3 hover:bg-[var(--color-green)]'"
        ></button>
      }
    </div>

    <div class="mt-10">
      <a
        href="/ministerios"
        class="inline-block rounded-sm border-[1.5px] border-[var(--color-green)] px-6 py-3 text-sm font-semibold text-[var(--color-green-deep)] transition hover:bg-[var(--color-green)] hover:text-[var(--color-cream)]"
      >
        Conocé todos nuestros servicios →
      </a>
    </div>
  </div>
</section>
