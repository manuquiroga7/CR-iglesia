<section id="noticias" class="bg-[var(--color-cream)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div class="mb-10 max-w-[640px]">
      <span class="mb-1 block font-[var(--font-accent)] text-3xl text-[var(--color-wine)]">Actualidad</span>
      <h2 class="font-[var(--font-heading)] text-3xl text-[var(--color-green-deep)] sm:text-4xl">Últimas noticias</h2>
      <p class="mt-3 max-w-[52ch] text-[var(--color-ink-soft)]">Lo que está pasando en nuestra congregación.</p>
    </div>

    <div class="grid grid-cols-1 gap-7 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of content.news; track item.title) {
        <article class="flex flex-col overflow-hidden rounded border border-[var(--color-cream-line)] bg-[var(--color-cream-deep)] transition hover:-translate-y-1 hover:shadow-[0_20px_34px_-20px_rgba(44,40,31,.14)]">
          <div class="flex aspect-[16/10] items-center justify-center bg-gradient-to-br from-[var(--color-green)] to-[var(--color-green-deep)]">
            <svg viewBox="0 0 64 64" fill="none" class="h-14 w-14">
              <path d="M32 6L32 30M22 14H42" stroke="#e7c9a9" stroke-width="2.2" stroke-linecap="round" />
              <path d="M10 52C10 52 16 34 32 34C48 34 54 52 54 52" stroke="#e7c9a9" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
          <div class="flex flex-1 flex-col gap-2 px-6 py-5">
            <span class="text-xs font-bold uppercase tracking-[0.08em] text-[var(--color-wine)]">{{ item.date }}</span>
            <h3 class="font-[var(--font-heading)] text-lg leading-tight text-[var(--color-green-deep)]">{{ item.title }}</h3>
            <p class="flex-1 text-sm text-[var(--color-ink-soft)]">{{ item.excerpt }}</p>
            <a href="#" class="mt-1 text-sm font-bold text-[var(--color-green-deep)] hover:underline">Leer más →</a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
