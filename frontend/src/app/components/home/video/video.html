<section class="bg-[var(--color-perola)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 text-center sm:px-8">
    <span class="block font-[family-name:var(--font-accent)] text-5xl text-[var(--color-verde-deep)]">Así se vive un culto</span>
    <h3 class="mt-1 font-[family-name:var(--font-heading)] text-4xl text-[var(--color-terracota)] sm:text-5xl">Mirá nuestra última reunión</h3>
    <p class="mx-auto mt-3 max-w-[46ch] text-[var(--color-ink-soft)]">Te invitamos a revivirlo, escucharlo de nuevo o compartirlo con quien todavía no pudo venir.</p>
    <div class="mx-auto mt-6 aspect-video max-w-3xl overflow-hidden rounded-md bg-black/40 shadow-[0_30px_60px_-24px_rgba(58,36,24,.35)]">
      <iframe
        class="h-full w-full"
        [src]="src"
        title="Último culto de Cristo es la Respuesta"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
    <a
      href="/mensajes"
      class="mt-6 inline-block cursor-pointer rounded-sm border-[1.5px] border-[var(--color-terracota)]/60 px-6 py-3 text-sm font-medium tracking-wide text-[var(--color-terracota)] transition hover:border-[var(--color-terracota)] hover:bg-[var(--color-terracota)]/10"
    >
      Ver mensajes y transmisiones →
    </a>
  </div>
</section>
