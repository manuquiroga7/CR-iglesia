<header
  class="fixed inset-x-0 top-0 z-40 transition-colors duration-300"
  [class]="scrolled()
    ? 'bg-[var(--color-cream)]/90 backdrop-blur'
    : 'bg-transparent'"
>
  <div class="mx-auto flex max-w-[1180px] items-center justify-between px-5 py-3 sm:px-8">
    <a href="#top" class="flex items-center gap-2.5">
      <span class="relative block h-9 w-9">
        <img
          src="images/branding/logo-claro.png"
          alt="Cristo es la Respuesta"
          class="absolute inset-0 h-9 w-9 object-contain transition-opacity duration-300"
          [class]="scrolled() ? 'opacity-0' : 'opacity-100'"
        />
        <img
          src="images/branding/logo.png"
          alt=""
          aria-hidden="true"
          class="absolute inset-0 h-9 w-9 object-contain transition-opacity duration-300"
          [class]="scrolled() ? 'opacity-100' : 'opacity-0'"
        />
      </span>
      <span
        class="font-[var(--font-heading)] leading-tight transition-colors duration-300"
        [class]="scrolled() ? 'text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]'"
      >
        <span class="block text-[1.02rem]">Cristo es la Respuesta</span>
        <span
          class="block font-[var(--font-body)] text-[0.62rem] font-semibold uppercase tracking-[0.14em] transition-colors duration-300"
          [class]="scrolled() ? 'text-[var(--color-ink-soft)]' : 'text-[var(--color-cream)]/75'"
        >
          Primer Tabernáculo Cristiano
        </span>
      </span>
    </a>

    <nav class="hidden items-center gap-7 md:flex">
      <a
        href="/"
        class="relative py-1 text-sm font-semibold transition-colors duration-300 after:absolute after:-bottom-1 after:left-0 after:right-0 after:h-0.5 after:bg-[var(--color-wine)] after:content-['']"
        [class]="scrolled() ? 'text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]'"
      >
        Inicio
      </a>
      <a
        href="/nosotros"
        class="py-1 text-sm font-semibold transition-colors duration-300"
        [class]="scrolled() ? 'text-[var(--color-ink-soft)] hover:text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]/85 hover:text-[var(--color-cream)]'"
      >
        Nosotros
      </a>
      <a
        href="/#noticias"
        class="py-1 text-sm font-semibold transition-colors duration-300"
        [class]="scrolled() ? 'text-[var(--color-ink-soft)] hover:text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]/85 hover:text-[var(--color-cream)]'"
      >
        Noticias
      </a>
      <a
        href="/#ministerios"
        class="py-1 text-sm font-semibold transition-colors duration-300"
        [class]="scrolled() ? 'text-[var(--color-ink-soft)] hover:text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]/85 hover:text-[var(--color-cream)]'"
      >
        Ministerios
      </a>
      <a
        href="/#ofrendar"
        class="rounded-sm border-[1.5px] px-5 py-2 text-sm font-semibold transition-colors duration-300"
        [class]="scrolled()
          ? 'border-[var(--color-green)] text-[var(--color-green-deep)] hover:bg-[var(--color-green)] hover:text-[var(--color-cream)]'
          : 'border-[var(--color-cream)]/70 text-[var(--color-cream)] hover:bg-[var(--color-cream)]/10'"
      >
        Ofrendar
      </a>
    </nav>
  </div>
</header>
