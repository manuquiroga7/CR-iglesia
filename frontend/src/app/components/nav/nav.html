<header
  class="fixed inset-x-0 top-0 z-40 transition-colors duration-300"
  [class]="scrolled() || mobileMenuOpen()
    ? 'bg-[var(--color-cream)]/90 backdrop-blur'
    : 'bg-transparent'"
>
  <div class="mx-auto flex max-w-[1180px] items-center justify-between px-5 py-3 sm:px-8">
    <a href="#top" class="flex items-center gap-2.5">
      <span
        role="img"
        aria-label="Cristo es la Respuesta"
        class="block h-9 w-9 bg-[var(--color-terracota)] [mask:url('/images/branding/logo.png')_center/contain_no-repeat]"
      ></span>
      <span
        class="font-[family-name:var(--font-heading)] leading-tight transition-colors duration-300"
        [class]="scrolled() || mobileMenuOpen() ? 'text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]'"
      >
        <span class="block text-[1.02rem]">Cristo es la Respuesta</span>
        <span
          class="block font-[family-name:var(--font-body)] text-[0.62rem] font-semibold uppercase tracking-[0.14em] transition-colors duration-300"
          [class]="scrolled() || mobileMenuOpen() ? 'text-[var(--color-ink-soft)]' : 'text-[var(--color-cream)]/75'"
        >
          Primer Tabernáculo Cristiano
        </span>
      </span>
    </a>

    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="relative flex h-9 w-9 cursor-pointer items-center justify-center xl:hidden"
      [class]="scrolled() || mobileMenuOpen() ? 'text-[var(--color-green-deep)]' : 'text-[var(--color-cream)]'"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Abrir menú"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        @if (mobileMenuOpen()) {
          <path d="M5 5l14 14M19 5L5 19" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>

    <nav class="hidden items-center gap-6 xl:flex">
      @for (link of desktopLinks; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          [attr.aria-current]="isActive(link) ? 'page' : null"
          class="relative cursor-pointer py-1 text-sm font-semibold transition-colors duration-300 after:absolute after:-bottom-1 after:left-0 after:right-0 after:h-0.5 after:origin-left after:transition-transform after:duration-300 after:content-['']"
          [class]="isActive(link)
            ? 'text-[var(--color-terracota)] after:bg-[var(--color-terracota)] after:[transform:scaleX(1)]'
            : 'text-[var(--color-ink-soft)] after:bg-[var(--color-terracota)] after:[transform:scaleX(0)] hover:text-[var(--color-terracota)] hover:after:[transform:scaleX(1)]'"
        >
          {{ link.label }}
        </a>
      }
      <a
        href="/ofrendar"
        class="rounded-sm border-[1.5px] px-5 py-2 text-sm font-semibold transition-colors duration-300"
        [class]="scrolled()
          ? 'border-[var(--color-green)] text-[var(--color-green-deep)] hover:bg-[var(--color-green)] hover:text-[var(--color-cream)]'
          : 'border-[var(--color-cream)]/70 text-[var(--color-cream)] hover:bg-[var(--color-cream)]/10'"
      >
        Ofrendar
      </a>
    </nav>
  </div>

  @if (mobileMenuRendered()) {
    <nav
      class="max-h-[calc(100vh-4.5rem)] overflow-y-auto border-t border-[var(--color-cream-line)] px-5 pb-6 pt-2 xl:hidden"
      [class]="mobileMenuOpen() ? 'animate-menu-in' : 'animate-menu-out'"
    >
      <ul>
        @for (link of mobileLinks; track link.href) {
          <li class="border-b border-[var(--color-cream-line)]/70">
            @if (link.fragment) {
              <a
                (click)="closeMobileMenu()"
                routerLink="/"
                [fragment]="link.fragment"
                class="flex items-center justify-between py-4 text-base font-semibold text-[var(--color-green-deep)] transition-colors hover:text-[var(--color-wine)]"
              >
                {{ link.label }}
                <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current stroke-2 opacity-60" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
            } @else {
              <a
                (click)="closeMobileMenu()"
                [href]="link.href"
                class="flex items-center justify-between py-4 text-base font-semibold transition-colors"
                [class]="link.href === currentPath()
                  ? 'text-[var(--color-wine)]'
                  : 'text-[var(--color-green-deep)] hover:text-[var(--color-wine)]'"
              >
                {{ link.label }}
                <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current stroke-2 opacity-60" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
            }
          </li>
        }
      </ul>
      <a
        (click)="closeMobileMenu()"
        href="/ofrendar"
        class="mt-5 block rounded-sm bg-[var(--color-green)] px-5 py-3.5 text-center text-sm font-semibold uppercase tracking-[0.08em] text-[var(--color-cream)] transition-colors hover:bg-[var(--color-green-deep)]"
      >
        Ofrendar
      </a>
    </nav>
  }
</header>
