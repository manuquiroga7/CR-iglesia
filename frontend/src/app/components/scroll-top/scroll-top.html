<button
  type="button"
  (click)="scrollToTop()"
  aria-label="Volver arriba"
  [attr.aria-hidden]="!visible()"
  [tabindex]="visible() ? 0 : -1"
  class="fixed bottom-20 right-5 z-30 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-[var(--color-green)] text-[var(--color-cream)] shadow-[0_10px_24px_-8px_rgba(44,40,31,.45)] transition duration-300 hover:bg-[var(--color-green-deep)] sm:bottom-8 sm:right-8"
  [class]="visible()
    ? 'opacity-100 [transform:translateY(0)]'
    : 'pointer-events-none opacity-0 [transform:translateY(1rem)]'"
>
  <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-2" aria-hidden="true">
    <path d="M6 15l6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>
