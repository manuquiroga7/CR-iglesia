<section
  class="relative flex min-h-[42vh] flex-col justify-end overflow-hidden bg-[radial-gradient(ellipse_80%_60%_at_15%_-10%,rgba(124,143,108,.35),transparent_60%),linear-gradient(165deg,var(--color-green-deep)_0%,#2f4527_45%,#26361f_100%)] text-[var(--color-cream)] [border-bottom-left-radius:50%_3rem] [border-bottom-right-radius:50%_3rem]"
>
  <div class="mx-auto w-full max-w-[1180px] px-5 pb-16 pt-28 sm:px-8 sm:pb-20 sm:pt-32">
    <div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.16em] text-[#cfd9c2]">
      <span class="inline-block h-px w-6 bg-[var(--color-wine)]"></span>
      Cristo es la Respuesta
    </div>
    <h1 class="max-w-[20ch] font-[var(--font-heading)] text-4xl leading-[1.05] text-[var(--color-cream)] sm:text-5xl">
      Nuestros ministerios
    </h1>
    <p class="mt-4 max-w-[52ch] text-lg text-[#d9dfcd]">
      Cada servicio es una oportunidad de poner los dones al servicio de Dios y de los demás. Hay un lugar para vos.
    </p>
  </div>
</section>

<section class="bg-[var(--color-neutral)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of content.ministries; track item.name) {
        <div class="flex flex-col gap-3 rounded border border-[var(--color-cream-line)] bg-[var(--color-cream)] p-6">
          <div class="flex h-11 w-11 items-center justify-center rounded-full bg-[var(--color-green)] text-[var(--color-cream)]">
            <svg viewBox="0 0 24 24" fill="none" class="h-5.5 w-5.5">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </div>
          <h3 class="font-[var(--font-heading)] text-lg text-[var(--color-green-deep)]">{{ item.name }}</h3>
          <p class="text-sm text-[var(--color-ink-soft)]">{{ item.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
