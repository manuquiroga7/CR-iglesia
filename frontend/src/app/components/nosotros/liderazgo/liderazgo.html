<section id="liderazgo" class="scroll-mt-32 bg-[var(--color-perola)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div class="mx-auto mb-12 max-w-[640px] text-center">
      <span class="mb-1 block font-[family-name:var(--font-accent)] text-4xl text-[var(--color-verde-deep)]">Quiénes nos guían</span>
      <h2 class="font-[family-name:var(--font-heading)] text-4xl text-[var(--color-terracota)] sm:text-5xl">Pastores y liderazgo</h2>
      <p class="mt-3 text-[var(--color-ink-soft)]">Hombres y mujeres que sirven a la congregación con vocación, cercanía y una vida de oración.</p>
    </div>

    <div class="grid gap-6 sm:grid-cols-3">
      @for (l of leaders; track $index) {
        <article class="overflow-hidden rounded bg-[var(--color-bege)]">
          <div class="relative flex aspect-[4/5] items-center justify-center bg-gradient-to-br from-[var(--color-azul)] to-[var(--color-verde)]">
            <svg viewBox="0 0 24 24" class="h-16 w-16 fill-none stroke-[var(--color-perola)] stroke-[1.2]" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
            </svg>
            <span class="absolute bottom-3 left-4 right-4 text-[0.65rem] font-medium uppercase tracking-[0.14em] text-[var(--color-perola)]">Foto · a cargar</span>
          </div>
          <div class="px-6 py-5">
            <h3 class="font-[family-name:var(--font-heading)] text-2xl text-[var(--color-terracota)]">{{ l.name }}</h3>
            <p class="mt-1 text-xs font-medium uppercase tracking-[0.18em] text-[var(--color-ink-soft)]">{{ l.role }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
