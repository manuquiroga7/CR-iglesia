<section id="doctrina" class="scroll-mt-32 bg-[var(--color-neutral)] py-16 sm:py-24">
  <div class="mx-auto max-w-[1180px] px-5 sm:px-8">
    <div
      class="grid gap-10 rounded-md p-8 text-[var(--color-cream)] shadow-[0_30px_60px_-24px_rgba(44,40,31,.14)] sm:p-12 lg:grid-cols-[0.9fr_1.4fr]"
      style="background: var(--color-green-deep);"
    >
      <div>
        <span class="mb-1 block font-[var(--font-accent)] text-3xl text-[var(--color-wine)]">Doctrina</span>
        <h2 class="font-[var(--font-heading)] text-3xl text-[var(--color-cream)] sm:text-4xl">En qué creemos</h2>
        <p class="mt-3 text-[#cfd9c2]">
          Nuestra fe se apoya en la Biblia como Palabra de Dios y en las verdades centrales del cristianismo evangélico.
        </p>
      </div>

      <div class="grid gap-3">
        @for (item of beliefs; track item.title) {
          <div class="rounded border border-[var(--color-cream)]/14 bg-[var(--color-cream)]/6 px-5 py-4">
            <h3 class="font-[var(--font-heading)] text-lg font-medium text-[var(--color-cream)]">{{ item.title }}</h3>
            <p class="mt-1 text-sm text-[#cfd9c2]">{{ item.description }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
